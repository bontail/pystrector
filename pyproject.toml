[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pystrector"
# the version tracks the supported CPython version
version = "3.12.0"
description = "Python Struct Reflector"
authors = [{ name = "bontail" }]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pycparser>=2.22",
    "ruff>=0.9.6",
]

[tool.hatch.build.targets.wheel]
packages = ["pystrector"]

[tool.mypy]
ignore_missing_imports = true
exclude = [
    'core_datatypes\.py',
]

[tool.ruff]
exclude = [
    'core_datatypes.py'
]
target-version = "py312"