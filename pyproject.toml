[project]
name = "pystrector"
version = "3.12.0"
description = "Python Struct Reflector"
authors = ["bontail"]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "mypy>=1.15.0",
]

[dependency-groups]
dev = [
    "pycparser>=2.22",
    "ruff>=0.9.6",
]

[tool.mypy]
ignore_missing_imports = true
exclude = [
    'core_datatypes\.py',
]

[tool.ruff]
exclude = [
    'core_datatypes.py'
]
target-version = "py312"